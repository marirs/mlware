name: Arm7
on:
  pull_request:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '**/README.md'

jobs:
  build:
    name: Linux ARMv7
    runs-on: ubuntu-24.04
    env:
      CROSS_CONFIG: .github/cross.toml
    strategy:
      matrix:
        clang: [["17.0", "clang_17_0"]]  # Update this to the latest Clang version if needed
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v7
      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ matrix.clang[0] }}
          directory: ${{ runner.temp }}/llvm-${{ matrix.clang[0] }}
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake libclang-dev libc++-dev gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          sudo ldconfig
      # Install Rust
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: armv7-unknown-linux-gnueabihf
      - name: Install cross
        run: cargo install cross --locked --version 0.2.5
      - name: Build
        run: cross build --target armv7-unknown-linux-gnueabihf
